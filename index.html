<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Treatment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Pendaftaran Treatment</h2>
        <form id="pendaftaranForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat" required placeholder="Masukkan alamat lengkap"></textarea>
            </div>

            <div class="form-group">
                <label for="telepon">No WhatsApp</label>
                <input type="tel" id="telepon" name="telepon" required placeholder="Contoh: 08123456789">
            </div>

            <div class="form-group">
                <label for="tanggal">Tanggal Treatment</label>
                <input type="date" id="tanggal" name="tanggal" required>
            </div>

            <div class="form-group">
                <label for="jam">Jam Treatment</label>
                <input type="time" id="jam" name="jam" required>
            </div>

            <div class="form-group">
                <label for="keterangan">Keterangan Pembayaran</label>
                <select id="keterangan" name="keterangan">
                    <option value="Belum">Belum</option>
                    <option value="Lunas">Lunas</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Daftar Sekarang</button>
        </form>
        <div id="loading" style="display:none;">Sedang memproses...</div>
        <div id="responseMessage"></div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
