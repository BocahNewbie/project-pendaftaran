<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper">
        <!-- Kotak Form Pendaftaran -->
        <div class="card-container">
            <h2>Pendaftaran Treatment</h2>
            <form id="pendaftaranForm">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>

                <label for="alamat">Alamat</label>
                <input type="text" id="alamat" placeholder="Masukkan alamat lengkap" required>

                <label for="telepon">No WhatsApp</label>
                <input type="tel" id="telepon" placeholder="08123456789" required>

                <label for="tanggal">Tanggal Treatment</label>
                <select id="tanggal" required>
                    <option value="">-- Silahkan Pilih Tanggal --</option>
                    <option value="30 Oktober 2026">30 Oktober 2026</option>
                    <option value="31 Oktober 2026">31 Oktober 2026</option>
                    <option value="1 November 2026">1 November 2026</option>
                    <option value="2 November 2026">2 November 2026</option>
                    <option value="3 November 2026">3 November 2026</option>
                </select>

                <label for="jam">Jam Treatment</label>
<select id="jam" required>
    <option value="">-- Pilih Jam Treatment --</option>
    <option value="09.00 - 09.45">09.00 - 09.45</option>
    <option value="09.45 - 10.30">09.45 - 10.30</option>
    <option value="10.30 - 11.15">10.30 - 11.15</option>
    <option value="11.15 - 12.00">11.15 - 12.00</option>
    <option value="12.00 - 12.45">12.00 - 12.45</option>
    <option value="13.00 - 14.00" disabled>--- Istirahat (13.00 - 14.00) ---</option>
    <option value="14.00 - 14.45">14.00 - 14.45</option>
    <option value="14.45 - 15.30">14.45 - 15.30</option>
    <option value="15.30 - 16.15">15.30 - 16.15</option>
    <option value="16.15 - 17.00">16.15 - 17.00</option>
</select>

                <label for="keterangan">Keterangan Pembayaran</label>
                <select id="keterangan">
                    <option value="Belum">Belum</option>
                    <option value="Lunas">Lunas</option>
                </select>

                <button type="submit" id="submitBtn">Daftar Sekarang!</button>

<!-- Progress Bar Loading -->
<div id="loadingContainer" style="display:none; margin-top: 15px;">
    <div class="progress-bar-track">
        <div class="progress-bar-fill"></div>
    </div>
    <div id="loadingText" style="text-align:center; margin-top:6px; font-size:13px; color:#d4af37;">Sedang Memproses...</div>
</div>

        <!-- Kotak Status Kuota & Daftar Peserta Realtime -->
        <div class="card-container">
            <h3>📊 Daftar Peserta</h3>
            
            <div id="infoKuotaContainer">
                <!-- Data kuota realtime akan muncul di sini -->
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Tanggal Treatment</th>
                            <th>Jam</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPesertaBody">
                        <tr><td colspan="4" style="text-align: center; padding: 20px;">Memuat data peserta...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Popup Modal Ceria & Interaktif -->
<div id="popupModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <div class="modal-icon">🥳🎉</div>
        <h3>Yeay, Berhasil Terdaftar!</h3>
        <p>Data kamu sudah tersimpan! ✨</p>
        <button id="closeModalBtn" class="modal-btn">Mantap, Lanjutkan! 👍</button>
    </div>
</div>

    <script src="javascript.js"></script>
</body>
</html>
