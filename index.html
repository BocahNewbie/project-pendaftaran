<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Formulir Pendaftaran</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required>
            </div>
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telepon">Nomor WhatsApp</label>
                <input type="tel" id="telepon" name="telepon" required>
            </div>
            <div class="form-group">
                <label for="kategori">Kategori Pendaftaran</label>
                <select id="kategori" name="kategori" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="Merangkak">Merangkak</option>
                    <option value="Berjalan">Berjalan</option>
                    <option value="Pindah Bola">Pindah Bola</option>
                </select>
            </div>
            <button type="submit" id="submitBtn">Daftar Sekarang</button>
        </form>
    </div>

    <!-- POPUP SUKSES -->
    <div id="successPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <h3>Pendaftaran Berhasil!</h3>
            <p>Terima kasih, data Anda telah berhasil disimpan.</p>
            <button id="closeSuccessBtn">Tutup</button>
        </div>
    </div>

    <!-- POPUP DUPLIKAT / EROR -->
    <div id="duplicatePopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <h3 style="color: #d32f2f;">Data Sudah Terdaftar</h3>
            <p id="duplicateMessage">Maaf, data yang Anda masukkan sudah ada di sistem kami.</p>
            <button id="closeDuplicateBtn">Periksa Kembali</button>
        </div>
    </div>

    <footer class="credit">
            Created by <span>BOCAH NEWBIE</span>
        </footer>

    <script src="javascript.js"></script>
</body>
</html>
