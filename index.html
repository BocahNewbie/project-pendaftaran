<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Treatment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Pendaftaran Treatment</h2>
        <form id="pendaftaranForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required placeholder="MASUKKAN NAMA LENGKAP">
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <input type="text" id="alamat" name="alamat" required placeholder="Masukkan alamat lengkap">
            </div>

            <div class="form-group">
                <label for="telepon">No WhatsApp</label>
                <input type="tel" id="telepon" name="telepon" required placeholder="Contoh: 08123456789">
            </div>

            <div class="form-group">
                <label for="tanggal">Tanggal Treatment</label>
                <select id="tanggal" name="tanggal" required>
                    <option value="" disabled selected>-- Pilih Tanggal Treatment --</option>
                    <option value="30 Oktober 2026">30 Oktober 2026</option>
                    <option value="31 Oktober 2026">31 Oktober 2026</option>
                    <option value="1 November 2026">1 November 2026</option>
                    <option value="2 November 2026">2 November 2026</option>
                    <option value="3 November 2026">3 November 2026</option>
                </select>
            </div>

            <div class="form-group">
                <label for="jam">Jam Treatment (Keterangan)</label>
                <input type="text" id="jam" name="jam" required placeholder="Contoh: Sesi Pagi / Jam 10.00">
            </div>

            <div class="form-group">
                <label for="keterangan">Keterangan Pembayaran</label>
                <select id="keterangan" name="keterangan">
                    <option value="Belum">Belum</option>
                    <option value="Lunas">Lunas</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Daftar Sekarang</button>
        </form>

        <!-- Credit by Bocah Newbie di bawah form -->
        <div class="credit">
            Credit by <span>Bocah Newbie</span>
        </div>

        <div id="loading" style="display:none; text-align:center; margin-top:10px;">Sedang memproses...</div>
        <div id="responseMessage" style="text-align:center; margin-top:10px;"></div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
