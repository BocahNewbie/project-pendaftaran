<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Treatment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper">
        <!-- Kotak Form Pendaftaran -->
        <div class="card-container">
            <h2>Pendaftaran Treatment</h2>
            <form id="pendaftaranForm">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>

                <label for="alamat">Alamat</label>
                <input type="text" id="alamat" placeholder="Masukkan alamat lengkap" required>

                <label for="telepon">No WhatsApp</label>
                <input type="tel" id="telepon" placeholder="Contoh: 08123456789" required>

                <label for="tanggal">Tanggal Treatment</label>
                <select id="tanggal" required>
                    <option value="">-- Pilih Tanggal Treatment --</option>
                    <option value="30 Oktober 2026">30 Oktober 2026</option>
                    <option value="31 Oktober 2026">31 Oktober 2026</option>
                    <option value="1 November 2026">1 November 2026</option>
                    <option value="2 November 2026">2 November 2026</option>
                    <option value="3 November 2026">3 November 2026</option>
                </select>

                <label for="jam">Jam Treatment</label>
                <input type="text" id="jam" placeholder="Contoh: Jam 10.00" required>

                <label for="keterangan">Keterangan Pembayaran</label>
                <select id="keterangan">
                    <option value="Belum">Belum</option>
                    <option value="Lunas">Lunas</option>
                </select>

                <button type="submit" id="submitBtn">Daftar Sekarang</button>
                <div id="loading" style="display:none; text-align:center; margin-top:10px; color:#d4af37;">Memproses...</div>
            </form>
            <div class="credit">Credit by BOCAH NEWBIE</div>
        </div>

        <!-- Kotak Status Kuota & Daftar Peserta Realtime -->
        <div class="card-container">
            <h3>📊 Status Kuota & Daftar Peserta</h3>
            
            <div id="infoKuotaContainer">
                <!-- Data kuota realtime akan muncul di sini -->
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Tanggal Treatment</th>
                            <th>Jam</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPesertaBody">
                        <tr><td colspan="4" style="text-align: center; padding: 20px;">Memuat data peserta...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Popup Sukses -->
    <div id="popupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:999;">
        <div style="background:#1e293b; padding:30px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); text-align:center; max-width:400px; width:90%;">
            <h3 style="color:#d4af37; margin-top:0;">Pendaftaran Berhasil!</h3>
            <p style="color:#94a3b8; font-size:14px;">Data Anda telah tercatat secara realtime.</p>
            <button id="closeModalBtn" style="margin-top:15px; padding:10px 20px;">Tutup</button>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
