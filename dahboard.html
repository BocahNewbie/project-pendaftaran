<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran</title>
    
    <!-- Memanggil file style.html otomatis -->
    <!-- GANTI DENGAN INI -->
<link rel="styles" href="style.css">
</head>
<body>

<div class="container">
    <h2>Formulir Pendaftaran</h2>
    <form id="registrationForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required>
        </div>
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="telepon">Nomor WhatsApp</label>
            <input type="tel" id="telepon" name="telepon" required>
        </div>
        <div class="form-group">
            <label for="kategori">Kategori Pendaftaran</label>
            <select id="kategori" name="kategori" required>
                <option value="">-- Pilih Kategori --</option>
                <option value="Merangkak">Merangkak</option>
                <option value="Berjalan">Berjalan</option>
                <option value="Pindah Bola">Pindah Bola</option>
            </select>
        </div>
        <button type="submit" id="submitBtn">Daftar Sekarang</button>
    </form>
</div>

<!-- 1. POPUP SUKSES (HIJAU) -->
<div id="successPopup" class="popup-overlay" style="display: none;">
    <div class="popup-content shadow-sukses">
        <div class="popup-icon icon-sukses">✓</div>
        <h3>Pendaftaran Berhasil!</h3>
        <p>Terima kasih, data Anda telah berhasil disimpan.</p>
        <button id="closeSuccessBtn" class="btn-sukses">Tutup</button>
    </div>
</div>

<!-- 2. POPUP DUPLIKAT / EROR (MERAH) -->
<div id="duplicatePopup" class="popup-overlay" style="display: none;">
    <div class="popup-content shadow-eror">
        <div class="popup-icon icon-eror">✕</div>
        <h3 style="color: #d32f2f;">Data Sudah Terdaftar</h3>
        <p id="duplicateMessage">Maaf, data yang Anda masukkan sudah ada di sistem kami.</p>
        <button id="closeDuplicateBtn" class="btn-eror">Periksa Kembali</button>
    </div>
</div>

<!-- Memanggil file javascript.html otomatis -->
<!-- GANTI DENGAN INI -->
<link rel="javascript" href="javascript.js">


</body>
</html>
